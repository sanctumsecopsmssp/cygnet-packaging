ShortDescription: OpenSSL 3 provider for the Sanctum SecOps / Cygnus PKI stack
Description: |-
  Cygnet is an OpenSSL 3 provider maintained by Sanctum SecOps LLC. It supplies
  FIPS-delegating MAC operations (CYGNET-HMAC, CYGNET-CMAC, CYGNET-KMAC-128,
  CYGNET-KMAC-256) plus provider dispatch, capability discovery, and algorithm
  registration points for post-quantum KEM, signature, and key-management
  integrations used with Cygnus and Sanctum PKI infrastructure.
